<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interactive US States Map</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <style>
    html, body, #map {
      height: 100%;
      margin: 0;
    }

    .legend {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: white;
      padding: 10px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.5;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .legend-color {
      width: 16px;
      height: 16px;
      border-radius: 3px;
      display: inline-block;
    }

    #popup-content select, #popup-content button {
      width: 100%;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="legend" id="legend">
    <div class="legend-item"><span class="legend-color" style="background:red"></span>Home State</div>
    <div class="legend-item"><span class="legend-color" style="background:blue"></span>Stayed Overnight</div>
    <div class="legend-item"><span class="legend-color" style="background:green"></span>Day Trip</div>
    <div class="legend-item"><span class="legend-color" style="background:yellow"></span>Drove Through</div>
    <div class="legend-item"><span class="legend-color" style="background:purple"></span>Airport Layover Only</div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Map setup
    const map = L.map('map', {
      zoomSnap: 0.5,
      zoomControl: true,
      attributionControl: false
    }).setView([37.8, -96], 4);
  
    // Set white background instead of a basemap
    L.svg({ clickable: true }).addTo(map); // ensures interactivity still works
    document.getElementById("map").style.background = "white";
  
    const statusColors = {
      "Home State": "red",
      "Stayed Overnight": "blue",
      "Day Trip": "green",
      "Drove Through": "yellow",
      "Airport Layover Only": "purple"
    };
  
    let geojsonLayer;
  
    // Load GeoJSON
    fetch("us-states.geojson")
      .then(response => response.json())
      .then(data => {
        data.features.forEach(f => {
          if (!f.properties.status) f.properties.status = "";
        });
  
        geojsonLayer = L.geoJSON(data, {
          style: feature => ({
            color: "#555",
            weight: 1,
            fillOpacity: 0.7,
            fillColor: statusColors[feature.properties.status] || "#ccc"
          }),
          onEachFeature: (feature, layer) => {
            layer.on("click", () => openPopup(feature, layer));
          }
        }).addTo(map);
  
        map.fitBounds(geojsonLayer.getBounds());
      });
  
    function openPopup(feature, layer) {
      const currentStatus = feature.properties.status || "";
      const popupContent = document.createElement("div");
      popupContent.id = "popup-content";
      popupContent.innerHTML = `
        <strong>${feature.properties.name}</strong><br>
        <label for="status">Status:</label>
        <select id="status">
          <option value="">-- Select --</option>
          ${Object.keys(statusColors)
            .map(
              s => `<option value="${s}" ${
                s === currentStatus ? "selected" : ""
              }>${s}</option>`
            )
            .join("")}
        </select>
        <button id="save">Save</button>
      `;
  
      layer.bindPopup(popupContent).openPopup();
  
      popupContent.querySelector("#save").addEventListener("click", () => {
        const selected = popupContent.querySelector("#status").value;
        feature.properties.status = selected;
        layer.setStyle({
          fillColor: statusColors[selected] || "#ccc"
        });
        layer.closePopup();
      });
    }
  </script>
</body>
</html>
